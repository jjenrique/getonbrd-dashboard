# Tecnologías buscadas en el TEXTO de la oferta — EDITABLE A MANO
#
# Los tags oficiales de Get on Board son buenos pero topan en 10 por oferta y no
# cubren lo de nicho (OT/industrial, herramientas concretas de datos). Esto
# rellena ese hueco leyendo description/functions/desirable/projects/benefits.
#
# Formato:
#   slug-canonico:
#     name: Nombre a mostrar
#     match: [formas a buscar en el texto]     # opcional; por defecto, `name`
#
# Lo que salga de aquí se guarda con source='text' y se muestra distinto en el
# dashboard. Si una oferta ya trae el tag oficial, el oficial manda.
#
# CUIDADO con términos de 1-2 letras ("R", "Go", "C") o palabras comunes ("Excel"
# como verbo en inglés): la búsqueda respeta fronteras de palabra, pero "Go" sí
# casaría en "go to production". Esos ya vienen bien cubiertos por los tags
# oficiales, así que no están aquí a propósito.

